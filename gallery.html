<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gallery - Omilani Adejoke</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Georgia', serif; background: white; color: #2d1810; line-height: 1.6; }
        
        .menu-btn { position: fixed; top: 20px; left: 20px; z-index: 1000; cursor: pointer; background: transparent; border: none; font-size: 32px; color: #8B2E2E; transition: opacity 0.3s; }
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #8B2E2E; z-index: 1001; transition: left 0.3s ease; padding-top: 70px; box-shadow: 2px 0 15px rgba(0,0,0,0.3); }
        .sidebar.open { left: 0; }
        .sidebar a { display: block; color: white; text-decoration: none; padding: 16px 24px; font-size: 1.1rem; border-bottom: 1px solid rgba(255,255,255,0.15); }
        .sidebar a:hover { background: rgba(255,255,255,0.2); padding-left: 32px; }
        .sidebar .orbitcore { margin-top: 50px; border-top: 1px solid rgba(255,255,255,0.3); padding: 20px 24px; font-size: 0.85rem; text-align: center; color: rgba(255,255,255,0.7); font-style: italic; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: none; }
        .overlay.active { display: block; }
        
        .container { max-width: 1000px; margin: 0 auto; padding: 100px 24px 60px; }
        h1 { color: #8B2E2E; font-size: 2rem; text-align: center; margin-bottom: 40px; }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; margin-bottom: 50px; }
        .gallery-item { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.1); transition: transform 0.3s; }
        .gallery-item:hover { transform: translateY(-5px); }
        .gallery-item img { width: 100%; height: 250px; object-fit: cover; display: block; }
        .gallery-item .words { padding: 15px; text-align: center; color: #8B2E2E; font-style: italic; background: #fef5f0; }
        
        .back-home { display: inline-block; margin-top: 20px; background: #8B2E2E; color: white; text-decoration: none; padding: 12px 28px; border-radius: 40px; }
        footer { background: #f8f8f8; color: #888; text-align: center; padding: 30px 20px; font-size: 0.75rem; border-top: 1px solid #eee; margin-top: 40px; }
        
        @media (max-width: 600px) { .container { padding: 80px 20px 40px; } h1 { font-size: 1.5rem; } .menu-btn { font-size: 28px; } .gallery-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="sidebar" id="sidebar">
        <a href="index.html">🏠 Home</a>
        <a href="about.html">👭 About My Sister</a>
        <a href="epistle.html">💌 My Letter to You</a>
        <a href="gallery.html">📸 Gallery</a>
        <div class="orbitcore">✨ OrbitCore ✨</div>
    </div>
    <div class="overlay" id="overlay"></div>

    <div class="container">
        <h1>📸 Gallery of Beautiful Moments</h1>
        <div class="gallery-grid">
            <div class="gallery-item"><img src="images/gallery1.jpg" alt="Memory 1"><div class="words">🌸 Beautiful soul</div></div>
            <div class="gallery-item"><img src="images/gallery2.jpg" alt="Memory 2"><div class="words">💖 Endless love</div></div>
            <div class="gallery-item"><img src="images/gallery3.jpg" alt="Memory 3"><div class="words">🌟 Shining bright</div></div>
            <div class="gallery-item"><img src="images/gallery4.jpg" alt="Memory 4"><div class="words">💕 Always caring</div></div>
            <div class="gallery-item"><img src="images/gallery5.jpg" alt="Memory 5"><div class="words">🎉 Pure joy</div></div>
            <div class="gallery-item"><img src="images/gallery6.jpg" alt="Memory 6"><div class="words">✨ Simply the best</div></div>
        </div>
        <div style="text-align: center;"><a href="index.html" class="back-home">← Back to Home</a></div>
    </div>
    <footer><p>Made with love ❤️ for Omilani Adejoke</p><p>✨ OrbitCore — crafted with heart ✨</p></footer>
    <script>
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        function openMenu() { sidebar.classList.add('open'); overlay.classList.add('active'); document.body.style.overflow = 'hidden'; }
        function closeMenu() { sidebar.classList.remove('open'); overlay.classList.remove('active'); document.body.style.overflow = ''; }
        menuBtn.addEventListener('click', (e) => { e.stopPropagation(); if (sidebar.classList.contains('open')) { closeMenu(); } else { openMenu(); } });
        overlay.addEventListener('click', closeMenu);
        document.querySelectorAll('.sidebar a').forEach(link => { link.addEventListener('click', () => { closeMenu(); }); });
    </script>
</body>
</html>
